<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumina Field OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { emerald: {
    50:'#E8F7EF',100:'#CDEFDD',200:'#A6E2C3',300:'#6FD0A2',400:'#33B87E',
    500:'#118A55',600:'#0C7044',700:'#0A5A38',800:'#08402A',900:'#06301F'
  } } } } };
</script>
<style>
  /* ===== Rumina Field OS デザイントークン ===== */
  :root{
    --bg:#F0F2F5; --surface:#FFFFFF; --surface-2:#F8FAFC;
    --text:#172026; --muted:#667085; --border:#E4E7EC;
    --primary:#118A55; --primary-hover:#0C7044; --primary-soft:#E8F7EF;
    --info:#2878D0; --warning:#F59E0B; --danger:#D92D20;
    --r-card:14px; --r-btn:10px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --shadow-hover:0 4px 10px rgba(16,24,40,.10);
  }
  :root[data-theme='dark']{
    --bg:#111714; --surface:#1B231F; --surface-2:#222D27;
    --text:#F4F7F5; --muted:#A7B0AB; --border:#303B35;
    --primary:#2AD889; --primary-hover:#4BE6A0; --primary-soft:#153D2A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4);
  }
  *{scrollbar-width:thin}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Geist','Inter',-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  @media (prefers-reduced-motion:no-preference){
    #app{animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  }
  body.logged-out .app-chrome{display:none !important}
  body.logged-out #layout{display:block}

  /* ===== 汎用カード/ボタン（新ビュー用） ===== */
  .fo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow)}
  .fo-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 16px;border-radius:var(--r-btn);font-size:14px;font-weight:600;cursor:pointer;
    background:var(--primary);color:#fff;border:1px solid transparent;transition:background .15s,transform .1s}
  .fo-btn:hover{background:var(--primary-hover)}
  .fo-btn:active{transform:translateY(1px)}
  .fo-btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
  .fo-btn.ghost:hover{background:var(--surface-2)}
  .fo-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
    font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary);border:1px solid transparent}
  .muted{color:var(--muted)}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

  /* ===== TopNav ===== */
  #topnav{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:14px;
    padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .tn-brand{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
  .tn-brand span{color:var(--primary)}
  .tn-search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:999px;padding:7px 14px;color:var(--muted);font-size:13px}
  .tn-search input{background:transparent;border:0;outline:0;color:var(--text);width:100%;font-size:13px}
  .tn-nav{display:flex;gap:4px;margin:0 auto}
  .tn-pill{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:10px;font-size:13.5px;
    font-weight:600;color:var(--muted);cursor:pointer;border:0;background:transparent;transition:.15s}
  .tn-pill:hover{background:var(--surface-2);color:var(--text)}
  .tn-pill.nav-active{color:var(--primary);background:var(--primary-soft)}
  .tn-ico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
    color:var(--muted);cursor:pointer;border:0;background:transparent}
  .tn-ico:hover{background:var(--surface-2);color:var(--text)}
  .tn-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:top;border:1px solid var(--border);cursor:pointer}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .sync-dot.warn{background:var(--warning)}.sync-dot.err{background:var(--danger)}

  /* ===== レイアウト（3カラム） ===== */
  #layout{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 320px;
    gap:20px;padding:20px 16px;align-items:start}
  #leftbar{position:sticky;top:80px;align-self:start}
  #rail{position:sticky;top:80px;align-self:start;display:flex;flex-direction:column;gap:14px}
  #feed{min-width:0;max-width:760px;margin:0 auto;width:100%}
  @media(max-width:1279px){ #layout{grid-template-columns:240px minmax(0,1fr)} #rail{display:none} }
  @media(max-width:899px){ #layout{grid-template-columns:1fr;padding:14px 12px 90px} #leftbar,#topnav .tn-nav,#topnav .tn-search{display:none} }

  /* 左サイドナビ */
  .lb-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;
    font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:0;cursor:pointer;transition:.12s}
  .lb-item:hover{background:var(--surface-2);color:var(--text)}
  .lb-item.nav-active{background:var(--primary-soft);color:var(--primary)}
  .lb-item svg{flex:none}
  .lb-sec{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;padding:14px 12px 6px}
  #leftbar .prof{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border-top:1px solid var(--border)}
  #leftbar .prof img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;border:1px solid var(--border)}

  /* モバイル下部ナビ */
  #botnav{position:fixed;bottom:0;inset-inline:0;z-index:40;display:none;grid-template-columns:repeat(5,1fr);
    background:var(--surface);border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
  @media(max-width:899px){ #botnav{display:grid} }
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:10px;font-weight:600;
    color:var(--muted);background:transparent;border:0;cursor:pointer}
  .bn-item.nav-active{color:var(--primary)}

  /* section()/h1 の緑帯を廃止（既存ビューを新テーマへ寄せる） */
  .mx-box,.mx-sec{margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
  .mx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);color:var(--text);padding:12px 16px;font-size:14px;font-weight:700;border-bottom:1px solid var(--border)}
  .mx-head .t{display:flex;align-items:center;gap:8px;min-width:0}
  .mx-head .t::before{content:"";width:4px;height:15px;background:var(--primary);border-radius:2px;flex:none}
  .mx-more{color:var(--primary);font-size:12px;font-weight:600;cursor:pointer}
  .mx-more:hover{text-decoration:underline}
  .mx-body{padding:14px 16px}
  .mx-sub{background:var(--surface-2);padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
  .mx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
  .mx-sec>.mx-card{border-top:0;border-radius:0 0 var(--r-card) var(--r-card)}
  .mx-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
  .mx-row:last-child{border-bottom:0}
  .mx-row .l{color:var(--muted)}
  .mx-row .v{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
  .mx-row .v.neg{color:var(--danger)}.mx-row .v.pos{color:var(--primary)}
  .mx-prof{display:flex;gap:12px;align-items:flex-start}
  .mx-prof>img{width:64px;height:64px;border-radius:12px;object-fit:cover;object-position:top;border:1px solid var(--border);flex:none}
  .mx-prof-n{font-size:16px;font-weight:700;color:var(--text)}
  .mx-prof-m{font-size:12px;color:var(--muted);margin-top:2px}
  .mx-prof-s{margin-top:7px;font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .mx-prof-s b{font-size:24px;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1}
  .mx-nav a{display:block;padding:8px 2px;font-size:13.5px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border)}
  .mx-nav a:last-child{border-bottom:0}
  .mx-nav a:hover{color:var(--primary)}
  .mx-2col{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media(min-width:1024px){.mx-2col{grid-template-columns:minmax(0,1fr) 280px}}
  .mx-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
  .mx-kpi-c{text-align:center;padding:4px}
  .mx-kpi-l{font-size:11px;color:var(--muted);margin-bottom:2px}
  .mx-kpi-v{font-size:34px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.1}
  .mx-kpi-v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
  .navlink{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text);background:none;border:0;cursor:pointer}
  .navlink:hover{background:var(--surface-2)}
  .nav-active{color:var(--primary)}
  /* 既存Tailwind色のダーク補正（ハードコード色の逃げ） */
  :root[data-theme='dark'] .bg-white{background:var(--surface) !important}
  :root[data-theme='dark'] .bg-neutral-50,:root[data-theme='dark'] .bg-neutral-100{background:var(--surface-2) !important}
  :root[data-theme='dark'] .bg-emerald-50{background:var(--primary-soft) !important}
  :root[data-theme='dark'] .text-neutral-900,:root[data-theme='dark'] .text-neutral-800{color:var(--text) !important}
  :root[data-theme='dark'] .text-neutral-700,:root[data-theme='dark'] .text-neutral-600,:root[data-theme='dark'] .text-neutral-500,:root[data-theme='dark'] .text-neutral-400{color:var(--muted) !important}
  :root[data-theme='dark'] .text-emerald-700,:root[data-theme='dark'] .text-emerald-600{color:var(--primary) !important}
  :root[data-theme='dark'] .border-neutral-200,:root[data-theme='dark'] .border-neutral-300,:root[data-theme='dark'] .divide-neutral-200>*{border-color:var(--border) !important}
  :root[data-theme='dark'] input,:root[data-theme='dark'] textarea,:root[data-theme='dark'] select{background:var(--surface-2);color:var(--text)}
  @media print{ #topnav,#leftbar,#rail,#botnav,.no-print{display:none !important} #layout{display:block} #feed{max-width:none} }
</style>

<!-- ===== TopNav ===== -->

    <img id="tnAvatar" class="tn-avatar" src="/assets/rumina.png" alt="マイページ" title="My Performance" onclick="nav('me')">
  </div>
</header>

      <button class="lb-item" data-nav="today" onclick="nav('today')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Today</button>
