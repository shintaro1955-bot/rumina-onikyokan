<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumina Field OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { emerald: {
    50:'#E8F7EF',100:'#CDEFDD',200:'#A6E2C3',300:'#6FD0A2',400:'#33B87E',
    500:'#118A55',600:'#0C7044',700:'#0A5A38',800:'#08402A',900:'#06301F'
  } } } } };
</script>
<style>
  /* ===== Rumina Field OS デザイントークン ===== */
  :root{
    --bg:#F6F7F8; --surface:#FFFFFF; --surface-2:#F4F5F6;
    --text:#1D1C1D; --muted:#616061; --border:#E4E6E8;
    /* サイドバーは本文と別の面にする（Slackのように、道具の側と中身の側を分ける） */
    --side:#F2F2F3; --side-text:#454345; --side-hover:#E7E7E8;
    --primary:#118A55; --primary-hover:#0C7044; --primary-soft:#E8F7EF;
    --info:#2878D0; --warning:#F59E0B; --danger:#D92D20;
    --r-card:10px; --r-btn:8px;
    /* 影で浮かせない。面の色と1本の境界線で分ける。 */
    --shadow:none;
    --shadow-hover:0 1px 3px rgba(16,24,40,.10);
  }
  :root[data-theme='dark']{
    --bg:#1A1D21; --surface:#222529; --surface-2:#27292D;
    --text:#D1D2D3; --muted:#9A9B9E; --border:#35373B;
    --side:#1A1D21; --side-text:#BCBDBE; --side-hover:#2C2D30;
    --primary:#2AD889; --primary-hover:#4BE6A0; --primary-soft:#153D2A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4);
  }
  *{scrollbar-width:thin}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Geist','Inter',-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  @media (prefers-reduced-motion:no-preference){
    #app{animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  }
  body.logged-out .app-chrome{display:none !important}
  body.logged-out #layout{display:block}
  /* ロープレ道場だけ全画面の集中モード（メニュー等を隠す） */
  body.rp-focus .app-chrome{display:none !important}
  body.rp-focus #layout{display:block;max-width:none;padding:0}
  body.rp-focus #feed{max-width:900px;padding:16px 14px 32px}
  #rpClose{display:none}
  body.rp-focus #rpClose{display:inline-flex;align-items:center;gap:6px}

  /* ページ見出し。上に貼り付いて、境界線1本で本文と分ける。
     どの画面にいるかが、スクロールしても分かるようにする。 */
  .pg-head{position:sticky;top:60px;z-index:20;background:var(--bg);
    padding:14px 0 12px;margin:0 0 16px;border-bottom:1px solid var(--border)}
  .pg-head h1{font-size:19px;font-weight:700;color:var(--text);letter-spacing:.01em;line-height:1.35;margin:0}
  .pg-head .pg-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
  @media(max-width:899px){ .pg-head{top:56px;padding:12px 0 10px;margin-bottom:14px} .pg-head h1{font-size:17.5px} }

  /* ===== 汎用カード/ボタン（新ビュー用） ===== */
  .fo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
  .fo-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 16px;border-radius:var(--r-btn);font-size:14px;font-weight:600;cursor:pointer;
    background:var(--primary);color:#fff;border:1px solid transparent;transition:background .15s,transform .1s}
  .fo-btn:hover{background:var(--primary-hover)}
  .fo-btn:active{transform:translateY(1px)}
  .fo-btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
  .fo-btn.ghost:hover{background:var(--surface-2)}
  .fo-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
    font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary);border:1px solid transparent}
  .muted{color:var(--muted)}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

  /* ===== TopNav ===== */
  #topnav{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:14px;
    padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .tn-brand{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
  .tn-brand span{color:var(--primary)}
  .tn-search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:999px;padding:7px 14px;color:var(--muted);font-size:13px}
  .tn-search input{background:transparent;border:0;outline:0;color:var(--text);width:100%;font-size:13px}
  .tn-nav{display:flex;gap:4px;margin:0 auto}
  .tn-pill{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:10px;font-size:13.5px;
    font-weight:600;color:var(--muted);cursor:pointer;border:0;background:transparent;transition:.15s}
  .tn-pill:hover{background:var(--surface-2);color:var(--text)}
  .tn-pill.nav-active{color:var(--primary);background:var(--primary-soft)}
  .tn-ico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
    color:var(--muted);cursor:pointer;border:0;background:transparent}
  .tn-ico:hover{background:var(--surface-2);color:var(--text)}
  .tn-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:top;border:1px solid var(--border);cursor:pointer}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none}
  /* 同期バッジの文字が狭い画面で2行に折れて崩れる。折らない。
     さらに、スマホでは cyzen の同期状況は見る場面がないので文字ごと畳む。 */
  /* ============ 画面の動き ============
     装飾ではなく「いま何が起きたか」を伝えるためだけに動かす。
     ・画面が変わった／カードが並んだ／押した／正解だった／合格した
     動きを嫌う人・酔う人がいるので prefers-reduced-motion は必ず尊重する。 */
  @keyframes foRise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @keyframes foFade { from{opacity:0} to{opacity:1} }
  @keyframes foPop  { 0%{transform:scale(.96);opacity:0} 60%{transform:scale(1.02)} 100%{transform:scale(1);opacity:1} }
  /* 選んだことだけを返す。**緑にしない**——正解したように見えて、間違いを覚えてしまう。 */
  @keyframes foPicked { 0%{background:var(--surface)} 30%{background:var(--surface-2)} 100%{background:var(--surface)} }
  @keyframes foShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  @keyframes foDraw { to{stroke-dashoffset:0} }
  @keyframes foBar  { from{width:0} }

  /* 画面を切り替えたとき。中身が入れ替わったことが分かる程度に。 */
  #app.view-in > *{ animation: foRise .26s cubic-bezier(.2,.7,.3,1) both }
  /* 並んだものは少しずつ遅らせる。全部が同時に出ると何が増えたか分からない。 */
  .fo-stagger > *{ animation: foRise .3s cubic-bezier(.2,.7,.3,1) both }
  .fo-stagger > *:nth-child(1){animation-delay:.02s} .fo-stagger > *:nth-child(2){animation-delay:.06s}
  .fo-stagger > *:nth-child(3){animation-delay:.10s} .fo-stagger > *:nth-child(4){animation-delay:.14s}
  .fo-stagger > *:nth-child(5){animation-delay:.18s} .fo-stagger > *:nth-child(6){animation-delay:.22s}
  .fo-stagger > *:nth-child(n+7){animation-delay:.26s}

  /* 押した手ごたえ。触れた瞬間に返す。 */
  button:not(:disabled), .lb-item, .tn-pill{ transition: transform .08s ease, background-color .15s ease, box-shadow .15s ease }
  button:not(:disabled):active, .lb-item:active{ transform: scale(.975) }
  .fo-btn{ transition: transform .08s ease, filter .15s ease }
  .fo-btn:hover{ filter: brightness(1.06) }

  /* 出題：選んだ瞬間に、選んだことだけ返す（正誤は最後まで出さない） */
  .q-choice{ transition: background-color .12s ease, border-color .12s ease, transform .08s ease }
  .q-choice.picked{ animation: foPicked .42s ease both; border-color: var(--muted) !important; border-width:2px !important }

  /* 結果 */
  .fo-result{ animation: foPop .38s cubic-bezier(.2,.8,.3,1) both }
  .fo-result.fail{ animation: foPop .3s ease both, foShake .42s .26s ease both }
  .fo-check path{ stroke-dasharray: 48; stroke-dashoffset: 48; animation: foDraw .5s .18s cubic-bezier(.4,0,.2,1) forwards }
  .fo-bar > i{ display:block; height:100%; border-radius:inherit; animation: foBar .7s .1s cubic-bezier(.2,.8,.3,1) both }

  /* 段が進んだとき、いまの段だけ一度だけ光らせる */
  @keyframes foGlow { 0%{box-shadow:0 0 0 0 rgba(15,122,69,.45)} 100%{box-shadow:0 0 0 12px rgba(15,122,69,0)} }
  .fo-now{ animation: foGlow 1.1s ease-out 2 }

  @media (prefers-reduced-motion: reduce){
    #app.view-in > *, .fo-stagger > *, .fo-result, .fo-result.fail, .fo-check path, .fo-bar > i, .fo-now, .q-choice.picked{
      animation: none !important
    }
    button:not(:disabled):active, .lb-item:active{ transform:none }
    *{ scroll-behavior: auto !important }
  }

  #syncBadge{white-space:nowrap}
  /* 研修のSTEP行は「番号｜説明｜ボタン」の横並び。狭い画面だと説明の列が
     数文字ぶんまで潰れて、文字が縦1列に流れて読めなくなる。折り返して縦に積む。 */
  @media(max-width:720px){
    .tr-step{flex-wrap:wrap;align-items:flex-start}
    .tr-step-body{flex:1 1 0%!important;min-width:0}      /* 番号とは横並びのまま */
    .tr-step-act{width:100%;margin-top:10px;padding-left:38px}
    .tr-step-act>div{justify-content:flex-start}
    .tr-why{max-width:none!important;text-align:left!important}
    .tr-step-act:has(>.muted){display:none}               /* まだ開かない段の「—」は出さない */
  }
  @media(max-width:899px){ #syncTxt{display:none} #syncBadge{width:38px;padding:0} }
  .sync-dot.warn{background:var(--warning)}.sync-dot.err{background:var(--danger)}

  /* ===== レイアウト（3カラム） ===== */
  #layout{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 320px;
    gap:20px;padding:20px 16px;align-items:start}
  /* サイドバーは「道具の面」。本文と別の背景にして、境界線1本で分ける。
     カードのように浮かせない。 */
  #leftbar{position:sticky;top:76px;align-self:start;background:var(--side);
    border:1px solid var(--border);border-radius:var(--r-card);padding:6px !important;
    max-height:calc(100vh - 92px);overflow:auto}
  #rail{position:sticky;top:80px;align-self:start;display:flex;flex-direction:column;gap:14px}
  #feed{min-width:0;max-width:760px;margin:0 auto;width:100%}
  @media(max-width:1279px){ #layout{grid-template-columns:240px minmax(0,1fr)} #rail{display:none} }
  @media(max-width:899px){ #layout{grid-template-columns:1fr;padding:14px 12px 90px} #leftbar,#topnav .tn-nav,#topnav .tn-search{display:none} }

  /* 左サイドナビ */
  /* 行は詰める。項目の数が見渡せるほうが道具として速い。
     選んでいる行だけを塗りつぶす（Slackと同じ考え方）。 */
  .lb-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:6px;
    font-size:14px;font-weight:500;color:var(--side-text);background:transparent;border:0;cursor:pointer;
    transition:background-color .1s ease,color .1s ease;line-height:1.35}
  .lb-item:hover{background:var(--side-hover);color:var(--text)}
  .lb-item.nav-active{background:var(--primary);color:#fff;font-weight:600}
  .lb-item.nav-active svg{opacity:.95}
  .lb-item svg{opacity:.65}
  .lb-item:hover svg{opacity:.85}
  /* まだ開いていない画面。隠さずに鍵で見せる＝次に何が待っているかが分かる方が前に進む */
  .lb-item.lb-locked{opacity:.4;cursor:not-allowed}
  .lb-item.lb-locked:hover{background:transparent;color:var(--muted)}
  .lb-item .lb-lock{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:0;white-space:nowrap;opacity:.75}
  .lb-item svg{flex:none}
  .lb-sec{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:16px 10px 5px}
  #leftbar .prof{display:flex;align-items:center;gap:10px;padding:10px;margin-top:10px;border-top:1px solid var(--border)}
  #leftbar .prof img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;border:1px solid var(--border)}

  /* モバイル下部ナビ */
  #botnav{position:fixed;bottom:0;inset-inline:0;z-index:40;display:none;grid-auto-flow:column;grid-auto-columns:1fr;
    background:var(--surface);border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
  @media(max-width:899px){ #botnav{display:grid} }
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:10px;font-weight:600;
    color:var(--muted);background:transparent;border:0;cursor:pointer}
  .bn-item.nav-active{color:var(--primary)}

  /* section()/h1 の緑帯を廃止（既存ビューを新テーマへ寄せる） */
  .mx-box,.mx-sec{margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
  .mx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);color:var(--text);padding:12px 16px;font-size:14px;font-weight:700;border-bottom:1px solid var(--border)}
  .mx-head .t{display:flex;align-items:center;gap:8px;min-width:0}
  .mx-head .t::before{content:"";width:4px;height:15px;background:var(--primary);border-radius:2px;flex:none}
  .mx-more{color:var(--primary);font-size:12px;font-weight:600;cursor:pointer}
  .mx-more:hover{text-decoration:underline}
  .mx-body{padding:14px 16px}
  .mx-sub{background:var(--surface-2);padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
  .mx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
  .mx-sec>.mx-card{border-top:0;border-radius:0 0 var(--r-card) var(--r-card)}
  .mx-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
  .mx-row:last-child{border-bottom:0}
  .mx-row .l{color:var(--muted)}
  .mx-row .v{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
  .mx-row .v.neg{color:var(--danger)}.mx-row .v.pos{color:var(--primary)}
  .mx-prof{display:flex;gap:12px;align-items:flex-start}
  .mx-prof>img{width:64px;height:64px;border-radius:12px;object-fit:cover;object-position:top;border:1px solid var(--border);flex:none}
  .mx-prof-n{font-size:16px;font-weight:700;color:var(--text)}
  .mx-prof-m{font-size:12px;color:var(--muted);margin-top:2px}
  .mx-prof-s{margin-top:7px;font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .mx-prof-s b{font-size:24px;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1}
  .mx-nav a{display:block;padding:8px 2px;font-size:13.5px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border)}
  .mx-nav a:last-child{border-bottom:0}
  .mx-nav a:hover{color:var(--primary)}
  .mx-2col{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media(min-width:1024px){.mx-2col{grid-template-columns:minmax(0,1fr) 280px}}
  .mx-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
  .mx-kpi-c{text-align:center;padding:4px}
  .mx-kpi-l{font-size:11px;color:var(--muted);margin-bottom:2px}
  .mx-kpi-v{font-size:34px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.1}
  .mx-kpi-v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
  .navlink{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text);background:none;border:0;cursor:pointer}
  .navlink:hover{background:var(--surface-2)}
  .nav-active{color:var(--primary)}
  /* 既存Tailwind色のダーク補正（ハードコード色の逃げ） */
  :root[data-theme='dark'] .bg-white{background:var(--surface) !important}
  :root[data-theme='dark'] .bg-neutral-50,:root[data-theme='dark'] .bg-neutral-100{background:var(--surface-2) !important}
  :root[data-theme='dark'] .bg-emerald-50{background:var(--primary-soft) !important}
  :root[data-theme='dark'] .text-neutral-900,:root[data-theme='dark'] .text-neutral-800{color:var(--text) !important}
  :root[data-theme='dark'] .text-neutral-700,:root[data-theme='dark'] .text-neutral-600,:root[data-theme='dark'] .text-neutral-500,:root[data-theme='dark'] .text-neutral-400{color:var(--muted) !important}
  :root[data-theme='dark'] .text-emerald-700,:root[data-theme='dark'] .text-emerald-600{color:var(--primary) !important}
  :root[data-theme='dark'] .border-neutral-200,:root[data-theme='dark'] .border-neutral-300,:root[data-theme='dark'] .divide-neutral-200>*{border-color:var(--border) !important}
  :root[data-theme='dark'] input,:root[data-theme='dark'] textarea,:root[data-theme='dark'] select{background:var(--surface-2);color:var(--text)}
  @media print{ #topnav,#leftbar,#rail,#botnav,.no-print{display:none !important} #layout{display:block} #feed{max-width:none} }
</style>

<!-- ===== TopNav ===== -->
<header id="topnav" class="app-chrome">
  <div class="tn-brand">Rumina <span>Field OS</span></div>
  <label class="tn-search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input placeholder="人・教材・成功事例を検索" aria-label="検索">
  </label>
  <nav class="tn-nav">
    <button class="tn-pill" data-nav="today" onclick="nav('today')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>TODAY</button>
    <button class="tn-pill" data-nav="academy" onclick="nav('academy')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6.5 12 3l9 3.5-9 3.5z"/><path d="M6 9v6c0 1.5 2.7 3 6 3s6-1.5 6-3V9"/></svg>ACADEMY</button>
    <button class="tn-pill" data-nav="field" onclick="nav('field')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6 9 3z"/><path d="M9 3v15M15 6v15"/></svg>FIELD</button>
    <button class="tn-pill" data-nav="league" onclick="nav('league')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v3a6 6 0 0 1-12 0z"/><path d="M6 5H3v1a4 4 0 0 0 4 4M18 5h3v1a4 4 0 0 1-4 4M9 20h6M12 13v7"/></svg>LEAGUE</button>
  </nav>
  <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
